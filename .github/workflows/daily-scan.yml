name: Daily multi-channel pet intelligence scan

on:
  schedule:
    - cron: '30 0 * * *' # 08:30 China Standard Time
  workflow_dispatch:
    inputs:
      channel_scope:
        description: 'Refresh scope / 刷新范围'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - brand_official
          - specialty_retail
          - mass_retail
          - drugstore
          - marketplace
          - trade_media
  push:
    paths:
      - 'config/sources.json'
      - 'config/hotspot-sources.json'
      - 'scripts/scan.py'
      - 'scripts/hotspots.py'
      - '.github/workflows/daily-scan.yml'

permissions:
  contents: write

concurrency:
  group: daily-pet-intelligence-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan product launch channels
        run: python scripts/scan.py --channels "${{ github.event.inputs.channel_scope || 'all' }}"

      - name: Scan global hotspots
        run: python scripts/hotspots.py --channels "${{ github.event.inputs.channel_scope || 'all' }}"

      - name: Commit intelligence data
        run: |
          git config user.name "pet-launch-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-status.json data/discovery.json data/discovered-links.json data/hotspots.json data/hotspot-state.json
          if git diff --cached --quiet; then
            echo "No intelligence changes"
          else
            git commit -m "chore: update pet intelligence data"
            git pull --rebase origin main
            git push
          fi
