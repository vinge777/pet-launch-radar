name: Daily multi-channel pet intelligence scan

on:
  schedule:
    - cron: '17 0,6,12,18 * * *' # every 6h; reduces delay risk of scheduled runs
  workflow_dispatch:
    inputs:
      channel_scope:
        description: 'Refresh scope / 刷新范围'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - brand_official
          - specialty_retail
          - mass_retail
          - drugstore
          - marketplace
          - trade_media
  push:
    paths:
      - 'config/sources.json'
      - 'config/sources-expanded.json'
      - 'config/focus-brands.json'
      - 'config/hotspot-sources.json'
      - 'config/research-sources.json'
      - 'scripts/merge_monitoring_config.py'
      - 'scripts/scan.py'
      - 'scripts/scan_parallel.py'
      - 'scripts/promote_candidates.py'
      - 'scripts/product_quality.py'
      - 'scripts/hotspots.py'
      - 'scripts/hotspot_research.py'
      - 'scripts/hotspot_quality.py'
      - '.github/workflows/daily-scan.yml'

permissions:
  contents: write

concurrency:
  group: daily-pet-intelligence-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge expanded monitoring config
        run: python scripts/merge_monitoring_config.py

      - name: Scan product launch channels in parallel
        run: python scripts/scan_parallel.py --channels "${{ github.event.inputs.channel_scope || 'all' }}"

      - name: Promote verified product candidates
        run: python scripts/promote_candidates.py

      - name: Refine formal product feed
        run: python scripts/product_quality.py

      - name: Scan global hotspots
        run: python scripts/hotspots.py --channels "${{ github.event.inputs.channel_scope || 'all' }}"

      - name: Scan research reports
        run: python scripts/hotspot_research.py --channels "${{ github.event.inputs.channel_scope || 'all' }}"

      - name: Refine hotspot relevance and summaries
        run: python scripts/hotspot_quality.py

      - name: Commit intelligence data safely
        run: |
          git config user.name "pet-launch-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/pet-intelligence-data
          cp data/products.json /tmp/pet-intelligence-data/
          cp data/source-status.json /tmp/pet-intelligence-data/
          cp data/discovery.json /tmp/pet-intelligence-data/
          cp data/discovered-links.json /tmp/pet-intelligence-data/
          cp data/hotspots.json /tmp/pet-intelligence-data/
          cp data/hotspot-state.json /tmp/pet-intelligence-data/

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/pet-intelligence-data/products.json data/
          cp /tmp/pet-intelligence-data/source-status.json data/
          cp /tmp/pet-intelligence-data/discovery.json data/
          cp /tmp/pet-intelligence-data/discovered-links.json data/
          cp /tmp/pet-intelligence-data/hotspots.json data/
          cp /tmp/pet-intelligence-data/hotspot-state.json data/

          git add data/products.json data/source-status.json data/discovery.json data/discovered-links.json data/hotspots.json data/hotspot-state.json
          if git diff --cached --quiet; then
            echo "No intelligence changes"
          else
            git commit -m "chore: update pet intelligence data"
            git push origin main
          fi

  deploy:
    name: Publish refreshed intelligence to Pages
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest published intelligence
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Confirm latest generated data is checked out
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ('products.json', 'source-status.json', 'hotspots.json'):
              data = json.loads((Path('data') / filename).read_text(encoding='utf-8'))
              print(f'{filename} generated_at: {data.get("generated_at")}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload latest site and data
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy current scan to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
